title: "ROS Robot Course"
# To this (one of these):
# Use remote_theme instead of theme
remote_theme: just-the-docs/just-the-docs

# Enable necessary plugins
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Just the Docs specific settings (optional)
just_the_docs:
  collections:
    tutorials:
      permalink: /:path/
  aux_links:
    "View on GitHub":
      - "//github.com/your-username/your-repo"

# Exclude files you don't want processed
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

